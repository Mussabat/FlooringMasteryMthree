# Builds the project with Maven, runs the tests, and measures coverage with JaCoCo.
# Runs on every push to main and on every pull request targeting main.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: maven

      # verify = compile + test + package + JaCoCo report + JaCoCo coverage check
      - name: Build and test with Maven
        run: mvn -B verify

      - name: Show test coverage
        if: always()
        run: |
          awk -F, 'NR>1 {m+=$8; c+=$9} END {printf "Test coverage (lines): %.1f%%\n", c*100/(m+c)}' target/site/jacoco/jacoco.csv | tee -a "$GITHUB_STEP_SUMMARY"
